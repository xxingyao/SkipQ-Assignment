[pytest]
pythonpath = .
testpaths = tests
markers =
    browser: drives a real browser against both running applications (Question 6a)
addopts = -m "not browser" -q
filterwarnings =
    # The pinned Flask 2.2.2 / flask-mongoengine 1.0.0 stack predates Python
    # 3.12 and warns from inside its own code on every request. Silenced so a
    # warning raised by SkipQ is visible instead of buried in 2,600 lines.
    ignore::DeprecationWarning