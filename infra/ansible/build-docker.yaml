---
# ============================================================================
#  build-docker.yaml — build the backend + MongoDB images and push them to ECR
#  Question 3(b) SCAFFOLD — complete the YOUR SCRIPT block below, then run.
# ============================================================================
# YOU FILL: write the build-and-push tasks yourself, in the marked block between
#           `# --- YOUR SCRIPT STARTS HERE ---` and `# --- YOUR SCRIPT ENDS HERE ---`.
#
# This playbook is run via two commands — the same playbook, reused twice:
#   # Question 3(b) — seed the ECR repos by hand (image_tag defaults to `latest`):
#   ansible-playbook build-docker.yaml -e backend_repo=<url> -e mongo_repo=<url>
#   # Question 4 — the Jenkins pipeline pushes an immutable release tag (v${BUILD_NUMBER}):
#   ansible-playbook build-docker.yaml -e backend_repo=<url> -e mongo_repo=<url> -e image_tag=v42

- name: Build and push the backend and MongoDB images to ECR
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    aws_region: us-east-1

    # The two ECR repository URLs (Question 2 `terraform output`). Pass them with
    # -e on the command line, or fill them here.
    backend_repo: "REPLACE_WITH_backend_ecr_repository_url"
    mongo_repo: "REPLACE_WITH_mongo_ecr_repository_url"

    # `playbook_dir` is infra/ansible, so the backend source is two levels up.
    backend_context: "{{ playbook_dir }}/../../backend"

    # Parameterize the image tag so Question 4/Question 5 can hand this
    #   playbook a version (e.g. v${BUILD_NUMBER}). Default it to `latest` for the
    #   Question 3(b) seed.
    image_tag: "latest"

  tasks:
  - name: Fail early if the ECR repository URLs are not filled in
    fail:
      msg: >-
        Set backend_repo and mongo_repo to the Question 2 ECR repository URLs
        (terraform outputs backend_ecr_repository_url / mongo_ecr_repository_url).
    when: backend_repo is search('REPLACE_WITH') or mongo_repo is search('REPLACE_WITH')

  - name: Derive the ECR registry host from the repository URL
    set_fact:
      ecr_registry: "{{ backend_repo.split('/')[0] }}"

  - name: Authenticate Docker to ECR through the instance profile
    shell: >-
      aws ecr get-login-password --region {{ aws_region }}
      | docker login --username AWS --password-stdin {{ ecr_registry }}
    changed_when: false

  # --- YOUR SCRIPT STARTS HERE ---
  # Write the Ansible tasks that BUILD and PUSH both backend and MongoDB to their ECR repos,
  # each tagged with `image_tag`:
  - name: Build the backend image
    command: docker build -t {{ backend_repo }}:{{ image_tag }} {{ backend_context }}

  - name: Push the backend image to ECR
    command: docker push {{ backend_repo }}:{{ image_tag }}

  - name: Build the MongoDB image (seed data baked in from db_seed/)
    command: docker build -t {{ mongo_repo }}:{{ image_tag }} -f {{ backend_context }}/DockerfileMongo {{ backend_context }}

  - name: Push the MongoDB image to ECR
    command: docker push {{ mongo_repo }}:{{ image_tag }}


  # --- YOUR SCRIPT ENDS HERE ---

  - name: Prune dangling build layers to conserve disk on the CI host
    command: docker system prune -f
    changed_when: false
