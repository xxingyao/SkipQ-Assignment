# ============================================================================
#  Question 3(b) — static deploy inventory (NOT AWS dynamic inventory)
# ============================================================================
# Build this inventory from your Question 2 `terraform output` values. There are
# now TWO hosts with different roles;
# Fill every TODO(Q3b) below with the actual values from your Question 2 `terraform output`.
#
# Private addresses on purpose: the CI host reaches app/db over the internal
# network, which is what the "SSH from the CI host only" security-group rule
# matches.

[app]
# TODO(Q3b): the application host's PRIVATE DNS (Question 2 output).
application ansible_host=ip-172-31-42-96.ec2.internal

[db]
# TODO(Q3b): the database host's PRIVATE address (Question 2 output).
database ansible_host=172.31.40.21

[all:vars]
ansible_user=ubuntu
# `~` resolves to the home of whoever runs the deploy: /home/ubuntu for the
# manual Question 3(b) run, /var/lib/jenkins for the Question 4 pipeline (which
# runs Ansible as the `jenkins` service account). Each user has its own 0400 copy
# of the key (placed by common.yaml / jenkins.yaml) — a shared, group-readable
# key is not an option because SSH refuses a private key others can read.
ansible_ssh_private_key_file=~/labsuser.pem
# TODO(Q3b): the private ECR repository URLs the deploy pulls from (Question 2
#   outputs backend_ecr_repository_url / mongo_ecr_repository_url).
backend_ecr_repo=203635632743.dkr.ecr.us-east-1.amazonaws.com/ict381_backend
mongo_ecr_repo=203635632743.dkr.ecr.us-east-1.amazonaws.com/ict381_mongo
aws_region=us-east-1
