# Config for the Question 3(b) deploy, run FROM the CI host. Uses the static
# inventory (not AWS dynamic inventory) and the vockey key copied onto the CI host
# during the Question 3(a) bootstrap. Host-key checking is off because the app/db
# hosts are freshly provisioned each Start Lab. (Provided — no edits needed.)
[defaults]
inventory = ./inventory.ini
host_key_checking = False
remote_user = ubuntu
private_key_file = /home/ubuntu/labsuser.pem
interpreter_python = /usr/bin/python3

[ssh_connection]
retries = 10
