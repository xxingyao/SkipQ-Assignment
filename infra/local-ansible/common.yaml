---
# ============================================================================
#  Question 3(a) — CI host bootstrap, part 1: base toolchain + Docker
# ============================================================================
# Run FROM your machine over SSH (the CI host accepts key-based SSH from any
# address):
#
#   ansible-playbook common.yaml jenkins.yaml

- name: Bootstrap the CI host — base packages, Docker, Ansible, AWS CLI
  hosts: jenkins
  gather_facts: false
  become: yes
  become_user: root
  become_method: sudo

  tasks:
  - name: Install base packages
    apt:
      name: "{{ item }}"
      state: present
      update_cache: yes
    loop:
    - python3-pip
    - gnupg
    - software-properties-common
    - unzip
    - git
    - acl

  - name: Retrieve Ansible PPA GPG key
    get_url:
      url: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x6125E2A8C77F2818FB7BD15B93C4A3FD7BB9C367
      dest: /usr/share/keyrings/ansible-ppa.asc
      mode: "0644"

  - name: Add Ansible PPA repo
    deb822_repository:
      name: ansible-ubuntu-ppa
      types: deb
      uris: https://ppa.launchpadcontent.net/ansible/ansible/ubuntu
      suites: noble
      components: main
      architectures: amd64
      signed_by: /usr/share/keyrings/ansible-ppa.asc

  - name: Install Ansible on the CI host
    apt:
      name: ansible
      state: present
      update_cache: yes

  - name: Ensure the apt keyrings directory exists
    file:
      path: /etc/apt/keyrings
      state: directory
      mode: '0755'

  - name: Add Docker GPG key
    get_url:
      url: https://download.docker.com/linux/ubuntu/gpg
      dest: /etc/apt/keyrings/docker.asc
      mode: '0644'

  - name: Add Docker repo
    copy:
      dest: /etc/apt/sources.list.d/docker.list
      content: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu jammy stable\n"
      mode: '0644'

  - name: Install Docker engine and the compose plugin
    apt:
      name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
      state: present
      update_cache: true

  # The Question 3(b) seed (`build-docker.yaml`) runs the docker CLI on this host
  # as `ubuntu`, so ubuntu needs socket access without sudo. Add it to the docker
  # group.
  - name: Add the ubuntu user to the docker group
    user:
      name: ubuntu
      groups: docker
      append: yes

  - name: Download the AWS CLI v2 installer
    get_url:
      url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
      dest: /tmp/awscliv2.zip
      mode: '0644'

  - name: Unpack the AWS CLI v2 installer
    unarchive:
      src: /tmp/awscliv2.zip
      dest: /tmp
      remote_src: yes
      creates: /tmp/aws/install

  - name: Install the AWS CLI v2
    command: /tmp/aws/install --update
    args:
      creates: /usr/local/bin/aws

  # This copy is for the `ubuntu` user (the manual Question 3(b) run); jenkins.yaml
  # places a second `jenkins`-owned copy for the Question 4 pipeline, and the deploy
  # inventory references the key as `~/labsuser.pem` so it resolves to whichever
  # user runs the playbook.
  - name: Copy the vockey private key (labsuser.pem) onto the CI host for the ubuntu user
    copy:
      src: labsuser.pem
      dest: /home/ubuntu/labsuser.pem
      owner: ubuntu
      group: ubuntu
      mode: '0400'
