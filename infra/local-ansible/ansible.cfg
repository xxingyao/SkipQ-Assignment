[defaults]
inventory = ./inventory
ask_pass= False
private_key_file = labsuser.pem
# The CI host is freshly provisioned each Start Lab, so its SSH host key is not
# in known_hosts. Skip host-key verification so the bootstrap can connect.
host_key_checking = False
# Pin the target Python interpreter (Ubuntu ships python3 here) instead of letting
# Ansible auto-discover it, which silences the interpreter-discovery warning.
interpreter_python = /usr/bin/python3

[ssh_connection]
retries = 10